name: Build beellama CUDA sm_75

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      beellama_ref:
        description: 'beellama.cpp git ref'
        default: 'main'
        required: false
      cuda_arch:
        description: 'CUDA arch (75=T4, 80=A100, 89=RTX4090)'
        default: '75'
        required: false

env:
  BEE_REF: ${{ github.event.inputs.beellama_ref || 'main' }}
  CUDA_ARCH: ${{ github.event.inputs.cuda_arch || '75' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # Install CUDA from Ubuntu apt repos — fast (~2-3 min), no NVIDIA account needed
      - name: Install CUDA + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nvidia-cuda-toolkit cmake build-essential

      - name: Verify CUDA
        run: |
          nvcc --version
          nvidia-smi || echo "No GPU on runner (expected — we only compile)"

      - name: Clone beellama.cpp
        run: |
          git clone --depth 1 -b $BEE_REF https://github.com/Anbeeld/beellama.cpp.git beellama

      - name: Build
        run: |
          cd beellama
          cmake -B build \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCH \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CURL=OFF
          cmake --build build --config Release -j$(nproc)

      - name: Package
        run: |
          mkdir dist
          cd beellama
          cp build/bin/llama-server ../dist/
          find build -name '*.so*' -exec cp -P {} ../dist/ \; 2>/dev/null || true
          # CUDA runtime libs
          find /usr/lib/x86_64-linux-gnu -name 'libcudart*.so*' -exec cp -P {} ../dist/ \; 2>/dev/null || true
          find /usr/lib/x86_64-linux-gnu -name 'libcublas*.so*' -exec cp -P {} ../dist/ \; 2>/dev/null || true
          cd ..
          ls -lh dist/
          tar czf beellama-cuda-sm${CUDA_ARCH}.tar.gz dist/
          ls -lh beellama-cuda-sm${CUDA_ARCH}.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: beellama-cuda-sm${{ env.CUDA_ARCH }}.tar.gz
          append_body: true
          body: |
            ## beellama.cpp CUDA sm_${{ env.CUDA_ARCH }} prebuilt
            - Built from [beellama.cpp](https://github.com/Anbeeld/beellama.cpp) ref: `${{ env.BEE_REF }}`
            - For Colab T4: `curl -fL <url> | tar xzf -`
