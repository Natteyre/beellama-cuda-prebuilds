name: Build beellama CUDA sm_75

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      beellama_ref:
        description: 'beellama.cpp git ref (branch/tag/sha)'
        default: 'main'
        required: false
      cuda_arch:
        description: 'CUDA arch (75=T4, 80=A100, 89=RTX4090)'
        default: '75'
        required: false

env:
  BEE_REF: ${{ github.event.inputs.beellama_ref || 'main' }}
  CUDA_ARCH: ${{ github.event.inputs.cuda_arch || '75' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # ubuntu-22.04 runners have CUDA 12.x pre-installed at /usr/local/cuda
      - name: Verify CUDA
        run: |
          /usr/local/cuda/bin/nvcc --version
          echo "CUDA_PATH=/usr/local/cuda" >> $GITHUB_ENV
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install cmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential

      - name: Clone beellama.cpp
        run: |
          git clone --depth 1 -b $BEE_REF https://github.com/Anbeeld/beellama.cpp.git beellama

      - name: Build
        run: |
          cd beellama
          cmake -B build \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCH \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CURL=OFF \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
          cmake --build build --config Release -j$(nproc)

      - name: Package
        run: |
          mkdir dist
          cd beellama

          cp build/bin/llama-server ../dist/
          find build -name '*.so*' -exec cp -P {} ../dist/ \; 2>/dev/null || true

          # CUDA runtime libs
          for lib in libcudart libcublas libcublasLt libcudnn; do
            find /usr/local/cuda/lib64 -name "${lib}*.so*" -exec cp -P {} ../dist/ \; 2>/dev/null || true
          done

          cd ..
          ls -lh dist/
          tar czf beellama-cuda-sm${CUDA_ARCH}.tar.gz dist/
          ls -lh beellama-cuda-sm${CUDA_ARCH}.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: beellama-cuda-sm${{ env.CUDA_ARCH }}.tar.gz
          append_body: true
          body: |
            ## beellama.cpp CUDA sm_${{ env.CUDA_ARCH }} prebuilt
            - Built from [beellama.cpp](https://github.com/Anbeeld/beellama.cpp) ref: `${{ env.BEE_REF }}`
            - For Colab T4 (sm_75): `curl -fL <url> | tar xzf -`
